name: Bug report
description: Report a bug
labels: ["bug","P2"]
body:
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [P0, P1, P2, P3] }
