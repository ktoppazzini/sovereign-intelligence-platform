<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#1a2d4a"/>
      <stop offset="100%" style="stop-color:#0d1f35"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background - no rounded corners for maskable -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Safe zone content (within 80% center) -->
  <g transform="translate(256, 256) scale(0.7)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>
    
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    
    <!-- Neural nodes -->
    <circle cx="-50" cy="-70" r="10" fill="#3b82f6"/>
    <circle cx="50" cy="-70" r="10" fill="#8b5cf6"/>
    <circle cx="-70" cy="0" r="10" fill="#3b82f6"/>
    <circle cx="70" cy="0" r="10" fill="#8b5cf6"/>
    <circle cx="-50" cy="70" r="10" fill="#3b82f6"/>
    <circle cx="50" cy="70" r="10" fill="#8b5cf6"/>
    
    <!-- Central S -->
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="url(#accentGrad)">S</text>
  </g>
</svg>
