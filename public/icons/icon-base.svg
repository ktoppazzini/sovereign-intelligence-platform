<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#1a2d4a"/>
      <stop offset="100%" style="stop-color:#0d1f35"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.3"/>
  
  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Central S logo -->
  <g transform="translate(256, 256)">
    <!-- Neural network nodes -->
    <circle cx="-60" cy="-80" r="12" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="60" cy="-80" r="12" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="-80" cy="0" r="12" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="80" cy="0" r="12" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="-60" cy="80" r="12" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="60" cy="80" r="12" fill="#8b5cf6" filter="url(#glow)"/>
    
    <!-- Connecting lines -->
    <line x1="-60" y1="-80" x2="60" y2="-80" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="-60" y1="80" x2="60" y2="80" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="-60" y1="-80" x2="-80" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="60" y1="-80" x2="80" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="-80" y1="0" x2="-60" y2="80" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="80" y1="0" x2="60" y2="80" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    
    <!-- Central S -->
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#accentGrad)" filter="url(#glow)">S</text>
  </g>
  
  <!-- Bottom text -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.9">SOVEREIGN</text>
</svg>
